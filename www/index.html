<div class="app">
  <aside class="sidebar">

 project:['Новый проект',[['title','Название проекта','text'],['area','Направление','text'],['next','Следующий шаг','text'],['status','Статус','select',['Идея','В работе','На паузе','Завершён']]]],
 transaction:['Финансовая операция',[['type','Тип операции','select',['income','expense']],['category','Категория','text'],['amount','Сумма в гривнах','number'],['date','Дата','date']]],
 habit:['Новая привычка',[['title','Название привычки','text']]],

 };
 let [title,fields]=cfg[type];let form=fields.map(f=>{let [name,label,kind,opts]=f;let el=kind==='textarea'?`<textarea class="field" name="${name}" placeholder="${label}"></textarea>`:kind==='select'?`<select class="field" name="${name}">${opts.map(o=>`<option value="${o}">${o==='income'?'Доход':o==='expense'?'Расход':o}</option>`).join('')}</select>`:`<input class="field" name="${name}" type="${kind}" ${kind==='date'?'value="'+dateNow()+'"':''} ${kind==='number'?(name==='progress'?'min="0" max="100" step="5"':name==='mood'?'min="1" max="10" step="1"':'min="0" step="0.01"'):''} placeholder="${label}" ${name==='amount'?'step="0.01" min="0"':''}>`;
 return `<label><span class="form-label">${label}</span>${el}</label>`}).join('')+(type==='task'?'<label class="reminder-toggle"><input type="checkbox" name="remind" value="yes"> Напомнить уведомлением в браузере</label>':'');
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div><form id="entryForm" class="form-grid">${form}<div class="modal-actions"><button type="button" class="btn soft" onclick="closeModal()">Отмена</button><button class="btn gold" type="submit">Сохранить</button></div></form></div></div>`;

}

function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-hq-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...blank(),...JSON.parse(r.result)};save();render();toast('Данные импортированы')}catch(err){toast('Не удалось прочитать файл')}};r.readAsText(f);e.target.value=''}

function setTheme(theme){if(!['light','dark','midnight','sage'].includes(theme))theme='light';document.body.dataset.theme=theme;localStorage.setItem('personalHQTheme',theme);let sel=document.getElementById('themeSelect');if(sel)sel.value=theme}
function enableNotifications(){if(!('Notification'in window)){toast('Уведомления не поддерживаются этим браузером');return}if(Notification.permission==='granted'){toast('Напоминание включено');return}Notification.requestPermission().then(p=>toast(p==='granted'?'Уведомления разрешены':'Разрешение на уведомления не получено'))}
function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date();let stamp=now.toISOString().slice(0,16);let changed=false;data.tasks.forEach(t=>{if(!t.remind||t.done||t.notified||!t.date||!t.time)return;let due=new Date(t.date+'T'+t.time);if(due<=now&&now-due<24*60*60*1000){new Notification('PERSONAL HQ — напоминание',{body:t.text,tag:'task-'+t.id});t.notified=true;changed=true}});if(changed)save()}
setTheme(localStorage.getItem('personalHQTheme')||'light');render();setInterval(checkReminders,30000);checkReminders();
</script>
</body>
